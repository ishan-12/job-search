# Validates that resume PDF generation never breaks — runs the test suite in the
# exact production Docker image (Alpine + Chromium). This is the authoritative
# check; the local pre-commit hook is the fast first line of defense.
# Actions are pinned by commit SHA and kept current by Dependabot.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pdf-tests:
    name: resume PDF generation tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run PDF generation tests in the production image
        run: docker compose run --rm test
