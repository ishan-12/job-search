# Validates that resume PDF generation never breaks — runs the test suite in the
# exact production Docker image (Alpine + Chromium). This is the authoritative
# check; the local pre-commit hook is the fast first line of defense.
# Actions are pinned by commit SHA and kept current by Dependabot.
name: CI

on:
  push:
    branches: [main]
    # scout/ has its own suite (scout-tests.yml). Skipping it here keeps a
    # scout-only change from spending ~40 Chromium renders on resumes it
    # cannot affect -- tools/md-to-pdf.mjs only ever reads REPO_ROOT/resumes.
    paths-ignore: ['scout/**']
  pull_request:
    paths-ignore: ['scout/**']

permissions:
  contents: read

jobs:
  pdf-tests:
    name: resume PDF generation tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run PDF generation tests in the production image
        run: docker compose run --rm test
