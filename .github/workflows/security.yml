# Server-side secret scan. Local hooks can be bypassed with `git commit --no-verify`;
# this runs on GitHub and cannot be skipped, so it's the authoritative gate.
#
# We run the gitleaks binary directly (not gitleaks-action): the action diffs a
# commit range and fails on a repo's first commit (no parent to diff against),
# and it gates on a license for org repos. `gitleaks git` scans full history with
# neither problem. Actions are pinned by SHA; the gitleaks version is pinned below.
name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so gitleaks can scan every commit
      - name: Install gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan full git history
        run: gitleaks git . --no-banner --redact --config .gitleaks.toml
